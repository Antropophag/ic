name: shlz-test-registry

services:
  gateway:
    image: shlz-test-registry-gateway:demo
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: shlz-test-registry-backend:demo
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/runtime
    volumes:
      - document-data:/app/storage/documents
    restart: unless-stopped

  scheduler:
    image: shlz-test-registry-backend:demo
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/runtime
    command: ["php", "yii", "notification/work"]
    stop_signal: SIGTERM
    stop_grace_period: 15s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4.7-noble
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mariadb-data:
  document-data:
