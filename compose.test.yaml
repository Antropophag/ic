services:
  frontend:
    image: shlz-test-registry-test-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports: ["18080:8080"]
    depends_on:
      backend: {condition: service_started}

  backend:
    image: shlz-test-registry-test-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: test
    env_file: ${TEST_ENV_FILE:-.env.test}
    depends_on:
      mariadb: {condition: service_healthy}
      ad: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /app/runtime]
    volumes:
      - test-document-data:/app/storage/test-documents
      - ./deployment/test/web.php:/app/deployment/web.php:ro
      - ./deployment/test/console.php:/app/deployment/console.php:ro

  scheduler:
    image: shlz-test-registry-test-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: test
    env_file: ${TEST_ENV_FILE:-.env.test}
    depends_on:
      mariadb: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /app/runtime]
    volumes:
      - ./deployment/test/console.php:/app/deployment/console.php:ro
    command: ["php", "yii", "notification/work"]
    stop_signal: SIGTERM
    stop_grace_period: 15s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4.7-noble
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - test-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["${MAILPIT_PORT}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  ad:
    image: shlz-test-registry-test-ad
    build:
      context: .
      dockerfile: docker/test-ad.Dockerfile
      network: host
    hostname: ad
    cap_add: [SYS_ADMIN]
    volumes:
      - test-ad-data:/var/lib/samba
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -D Administrator@IC.TEST -w 'TestPassword1!' -b DC=ic,DC=test -s base dn >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    restart: unless-stopped

volumes:
  test-mariadb-data:
  test-document-data:
  test-ad-data:
