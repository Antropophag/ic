server {
    listen 8080;
    server_name _;
    root /srv/frontend;
    index index.html;

    # Совпадает с post_max_size в docker/php/uploads.ini (11M) — иначе
    # nginx по умолчанию (1M) молча режет любую загрузку раньше, чем до
    # неё дойдёт проверка размера на уровне приложения (лимит вложений —
    # 10 МБ, COM-007/DOC-002A).
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(api|health)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass backend:9000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
