map $request_uri $source_access_request_uri {
    default $request_uri;
    "~^/api/v1/document-links/[a-f0-9]{64}/download(?:\\?|$)" /api/v1/document-links/[masked]/download;
}

map $http_referer $source_access_referer {
    default $http_referer;
    "~^.*?/api/v1/document-links/[a-f0-9]{64}/download(?:[?#].*)?$" /api/v1/document-links/[masked]/download;
}

log_format source_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $source_access_request_uri $server_protocol" $status $body_bytes_sent '
                         '"$source_access_referer" "$http_user_agent" request_time=$request_time';

server {
    listen 8080;
    server_name _;
    root /srv/frontend;
    index index.html;

    # Оставляет запас над post_max_size в docker/php/uploads.ini (210M) для
    # multipart overhead. Такой же или больший лимит нужен на внешнем reverse
    # proxy, иначе запрос не дойдёт до прикладной проверки 200 МБ
    # (COM-007/DOC-002A).
    client_max_body_size 256m;

    access_log /var/log/nginx/access.log source_access;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # OpenAPI — проверенный публичный контракт. Swagger UI поставляется в
    # development и production без CDN; Try it out отключён, потому что
    # авторизация использует session cookie и CSRF.
    location = /api/openapi.yaml {
        default_type application/yaml;
        try_files $uri =404;
    }

    location = /api/docs {
        return 308 /api/docs/;
    }

    location ^~ /api/docs/ {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(api|health)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass backend:9000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
