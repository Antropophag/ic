openapi: 3.0.3
info:
  title: Реестр заявок на испытания API
  version: 1.0.0
  description: |
    Машиночитаемый контракт HTTP API корпоративного реестра. На первом этапе
    документируется репрезентативный вертикальный срез; отсутствие операции в
    этом файле пока не означает отсутствие маршрута в приложении.

    Бизнес-правила, процессы и эксплуатационные пояснения остаются в Markdown.
    Формы HTTP-запросов, ответов, параметров и статусов постепенно переносятся
    сюда как в официальный контракт.
servers:
  - url: /
    description: Тот же origin, с которого открыт портал
tags:
  - name: Health
  - name: Authentication
  - name: Requests
  - name: Administration
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Проверить, что процесс backend отвечает
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Backend работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Получить CSRF token и текущего пользователя
      description: |
        Маршрут доступен до входа и устанавливает CSRF cookie. Если действующей
        сессии нет, `user` равен `null`; это не ошибка аутентификации.
      operationId: getCurrentUser
      security: []
      responses:
        '200':
          description: CSRF token и состояние текущей сессии
          headers:
            Set-Cookie:
              description: Session/CSRF cookies с атрибутами, заданными Yii/PHP
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Войти через LDAP или настроенную break-glass учётную запись
      description: |
        Создаёт серверную пользовательскую сессию. Ошибки учётных данных не
        раскрывают, какой механизм аутентификации обработал логин. Недоступность
        корпоративного каталога возвращается отдельно от неверных данных.
      operationId: login
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Пользователь аутентифицирован, session cookie создана
          headers:
            Set-Cookie:
              description: Session/CSRF cookies с атрибутами, заданными Yii/PHP
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Учётная запись отключена в портале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Корпоративный каталог недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryUnavailableError'
              example:
                name: Service Unavailable
                message: Сервер авторизации недоступен. Обратитесь в техническую поддержку.
                code: 0
                status: 503
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/requests:
    get:
      tags: [Requests]
      summary: Получить страницу заявок
      operationId: listRequests
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: tab
          in: query
          schema:
            type: string
            enum: [active, all, mine]
            default: active
        - name: status
          in: query
          description: Статусы через запятую без пробелов и пустых элементов; пустое значение не ограничивает выборку.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              $ref: '#/components/schemas/RequestStatus'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
            default: ''
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: attention
          in: query
          description: |
            Персональная категория действия. Сервер проверяет полномочия и
            назначение текущего пользователя; параметр только сужает обычный
            доступный ему реестр. Поиск, статус и сортировка применяются поверх.
          schema:
            $ref: '#/components/schemas/AttentionQueueId'
      responses:
        '200':
          description: Страница доступных текущему пользователю заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/requests/dashboard:
    get:
      tags: [Requests]
      summary: Получить dashboard заявок
      description: |
        Возвращает категории реальных действий текущего активного
        пользователя с учётом ролей и действующих назначений. Счётчики точные,
        относятся ко всему доступному scope и не зависят от страницы, вкладки,
        поиска или статусного фильтра реестра. Одна заявка может входить в
        несколько категорий при совмещении полномочий. Категории с нулевым
        счётчиком не возвращаются. Всем аутентифицированным пользователям также
        возвращается operational summary общей текущей нагрузки.
      operationId: getRequestDashboard
      security:
        - cookieSession: []
      responses:
        '200':
          description: Персональные очереди текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionDashboard'
              example:
                categories:
                  - id: assign_executor
                    title: Назначить исполнителя
                    description: Назначьте ответственного за проведение испытаний.
                    count: 4
                operational_summary:
                  active: 12
                  unassigned: 3
                  ready_to_start: 2
                  in_progress: 5
                  suspended: 2
                  expertise: 3
                  security_review: 1
                  directions:
                    - id: mechanical
                      title: Механические испытания
                      color: blue
                      active: 4
                      unassigned: 1
                      executors:
                        - user_id: 42
                          display_name: Кашин Алексей
                          is_available: true
                          active: 4
                          in_progress: 3
                          suspended: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/requests/events:
    get:
      tags: [Requests]
      summary: Получить последние события в доступных заявках
      description: Возвращает последние комментарии и изменения процесса, выполненные другими пользователями.
      operationId: getRequestEvents
      security:
        - cookieSession: []
      responses:
        '200':
          description: Последние события, новые сначала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/requests/{id}/comments:
    post:
      tags: [Requests]
      summary: Добавить комментарий к заявке
      description: |
        Требует действующую session cookie, CSRF token из
        `GET /api/v1/auth/me` и новый `Idempotency-Key`. Успешный повтор того же
        намерения возвращает исходный ответ с `Idempotency-Replayed: true`.
        Swagger UI показывает контракт, но выполнение запросов в нём отключено:
        интерактивное управление session/CSRF создавало бы ложное ощущение
        безопасного входа и не является частью первого этапа.
      operationId: addRequestComment
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Числовой идентификатор заявки
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Уникальный ключ намерения на 24 часа. Допускаются 16–128 символов
            `A-Z`, `a-z`, `0-9`, `.`, `_`, `:`, `-`; первый символ буквенно-цифровой.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentInput'
      responses:
        '201':
          description: Комментарий создан или воспроизведён
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/requests/{id}/ai/technical-specification/analyze:
    post:
      tags: [Requests]
      summary: Проанализировать приложенное ТЗ через ЛИЗУ
      description: |
        INTERNAL PILOT. Независимая read-only AI-операция; не изменяет заявку.
        Ответ replay'ится до 24 часов для того же Idempotency-Key.
      operationId: analyzeTechnicalSpecification
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalSpecificationAiInput'
      responses:
        '200':
          description: Анализ, список кандидатов или понятное отсутствие ТЗ
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TechnicalSpecificationAnalysisCompleted'
                  - $ref: '#/components/schemas/TechnicalSpecificationChoiceRequired'
                  - $ref: '#/components/schemas/TechnicalSpecificationNotFound'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503':
          description: Функция выключена, timeout или недоступность ЛИЗЫ
          content: {application/json: {schema: {$ref: '#/components/schemas/HttpError'}}}

  /api/v1/requests/{id}/ai/technical-specification/draft:
    post:
      tags: [Requests]
      summary: Сформировать черновик ТЗ на испытания в независимом AI-chat
      description: |
        INTERNAL PILOT. Самостоятельная read-only задача с отдельными chat,
        upload и idempotency lifecycle; не использует результат анализа.
      operationId: createTestSpecificationDraft
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalSpecificationAiInput'
      responses:
        '200':
          description: Черновик, список кандидатов или понятное отсутствие ТЗ
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TestSpecificationDraftCompleted'
                  - $ref: '#/components/schemas/TechnicalSpecificationChoiceRequired'
                  - $ref: '#/components/schemas/TechnicalSpecificationNotFound'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503':
          description: Функция выключена, timeout или недоступность ЛИЗЫ
          content: {application/json: {schema: {$ref: '#/components/schemas/HttpError'}}}

  /api/v1/requests/{id}/reject:
    post:
      tags: [Requests]
      summary: Отказать в проведении испытаний с обязательной причиной
      operationId: rejectRequest
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReasonedRequestCommand'
      responses:
        '200': {$ref: '#/components/responses/RequestCommandSucceeded'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/requests/{id}/withdraw:
    post:
      tags: [Requests]
      summary: Отозвать заявку с обязательной причиной
      operationId: withdrawRequest
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReasonedRequestCommand'
      responses:
        '200': {$ref: '#/components/responses/RequestCommandSucceeded'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/requests/{id}/suspend:
    post:
      tags: [Requests]
      summary: Приостановить работу с обязательной причиной
      operationId: suspendRequest
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReasonedRequestCommand'
      responses:
        '200': {$ref: '#/components/responses/RequestCommandSucceeded'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/requests/{id}/report/delete:
    post:
      tags: [Requests]
      summary: Удалить отчёт с обязательной причиной
      operationId: deleteRequestReport
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReasonedRequestCommand'
      responses:
        '200': {$ref: '#/components/responses/RequestCommandSucceeded'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/requests/{id}/report-document-drafts/test-act:
    get:
      tags: [Requests]
      summary: Подготовить автозаполненные данные черновика акта испытаний
      operationId: prepareTestActDraft
      security: [{cookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Актуальные данные заявки и значения по умолчанию
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestActPreparation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Requests]
      summary: Сформировать редактируемый DOCX-черновик акта испытаний
      description: Не изменяет заявку и не создаёт версию итогового отчётного документа.
      operationId: generateTestActDraft
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestActInput'}
      responses:
        '200':
          description: DOCX-черновик акта испытаний
          headers:
            Content-Disposition:
              description: Имя скачиваемого файла
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/requests/{id}/security-decision:
    post:
      tags: [Requests]
      summary: Принять решение контроля СБ
      description: Причина обязательна для решения `return` и не требуется для `approve`.
      operationId: decideRequestSecurity
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityDecisionInput'
      responses:
        '200': {$ref: '#/components/responses/RequestCommandSucceeded'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/admin/users:
    get:
      tags: [Administration]
      summary: Получить пользователей с эксплуатационными timestamps
      operationId: listAdminUsers
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Пользователи, роли и время проверки ответа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/admin/users/{userId}/roles/{roleId}/revoke:
    post:
      tags: [Administration]
      summary: Отозвать роль пользователя с обязательной причиной
      operationId: revokeUserRole
      security: [{cookieSession: [], csrfToken: []}]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: roleId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRoleInput'
      responses:
        '200':
          description: Актуальный список ролей пользователя
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}

  /api/v1/admin/system-overview:
    get:
      tags: [Administration]
      summary: Получить состояние приложения и основных зависимостей
      operationId: getAdminSystemOverview
      security: [{cookieSession: []}]
      responses:
        '200':
          description: Независимые результаты безопасных read-only проверок
          content: {application/json: {schema: {$ref: '#/components/schemas/SystemOverview'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        Серверная PHP/Yii session cookie, выдаваемая после LDAP или break-glass
        входа. Заголовки development/test identity не являются production API.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token возвращается полем `csrfToken` из `GET /api/v1/auth/me` и
        должен соответствовать CSRF cookie. Это не bearer token и не заменяет
        session cookie.

  headers:
    IdempotencyReplayed:
      description: "`true`, если сохранённый terminal response был воспроизведён"
      schema:
        type: string
        enum: ['true', 'false']

  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: Числовой идентификатор заявки
      schema: {type: integer, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ намерения на 24 часа
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'

  requestBodies:
    ReasonedRequestCommand:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasonedLockVersionInput'

  responses:
    BadRequest:
      description: Некорректное JSON-тело или не прошедший CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Unauthorized:
      description: Действующая пользовательская сессия отсутствует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Forbidden:
      description: Текущему пользователю действие запрещено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NotFound:
      description: Заявка не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Conflict:
      description: |
        Действие запрещено текущим состоянием ресурса, ключ уже использован с
        другим телом или одновременный запрос не завершился за 30 секунд
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    UnsupportedMediaType:
      description: "`Content-Type` не равен `application/json`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    ValidationError:
      description: Ошибка query/body validation или отсутствующий Idempotency-Key
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrors'
              - $ref: '#/components/schemas/HttpError'
    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    RequestCommandSucceeded:
      description: Команда выполнена или воспроизведена идемпотентно
      headers:
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestCommandResult'

  schemas:
    TechnicalSpecificationAiInput:
      type: object
      properties:
        documentVersionId: {type: integer, minimum: 1}
      additionalProperties: false
    TechnicalSpecificationCandidate:
      type: object
      required: [versionId, name, mimeType, version]
      properties:
        versionId: {type: integer, minimum: 1}
        name: {type: string, minLength: 1}
        mimeType:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
        version: {type: integer, minimum: 1}
      additionalProperties: false
    TechnicalSpecificationChoiceRequired:
      type: object
      required: [status, documents]
      properties:
        status: {type: string, enum: [choice_required]}
        documents:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/TechnicalSpecificationCandidate'}
      additionalProperties: false
    TechnicalSpecificationNotFound:
      type: object
      required: [status, message]
      properties:
        status: {type: string, enum: [not_found]}
        message: {type: string, minLength: 1}
      additionalProperties: false
    TechnicalSpecificationAnalysis:
      type: object
      required: [criticalContradictions, ambiguousRequirements, missingInformation, testRequirements, initiatorQuestions, recommendations]
      properties:
        criticalContradictions: {type: array, items: {type: string}}
        ambiguousRequirements: {type: array, items: {type: string}}
        missingInformation: {type: array, items: {type: string}}
        testRequirements: {type: array, items: {type: string}}
        initiatorQuestions: {type: array, items: {type: string}}
        recommendations: {type: array, items: {type: string}}
      additionalProperties: false
    TechnicalSpecificationAnalysisCompleted:
      type: object
      required: [status, conversationId, documentVersionId, analysis]
      properties:
        status: {type: string, enum: [completed]}
        conversationId: {type: string, minLength: 1}
        documentVersionId: {type: integer, minimum: 1}
        analysis: {$ref: '#/components/schemas/TechnicalSpecificationAnalysis'}
      additionalProperties: false
    TestSpecificationDraftCompleted:
      type: object
      required: [status, conversationId, documentVersionId, draft, notice]
      properties:
        status: {type: string, enum: [completed]}
        conversationId: {type: string, minLength: 1}
        documentVersionId: {type: integer, minimum: 1}
        draft: {type: string, minLength: 1}
        notice: {type: string, minLength: 1}
      additionalProperties: false
    SystemOverview:
      type: object
      required: [application, services, checkedAt]
      properties:
        application:
          type: object
          required: [name, version, commitSha, builtAt]
          properties:
            name: {type: string}
            version: {type: string, nullable: true}
            commitSha: {type: string, nullable: true}
            builtAt: {type: string, format: date-time, nullable: true}
          additionalProperties: false
        services:
          type: object
          required: [database, ldap, smtp, storage]
          properties:
            database: {$ref: '#/components/schemas/DatabaseSystemServiceStatus'}
            ldap: {$ref: '#/components/schemas/LdapSystemServiceStatus'}
            smtp: {$ref: '#/components/schemas/SmtpSystemServiceStatus'}
            storage: {$ref: '#/components/schemas/StorageSystemServiceStatus'}
          additionalProperties: false
        checkedAt: {type: string, format: date-time}
      additionalProperties: false
    DatabaseSystemServiceStatus:
      type: object
      required: [status, message, details]
      properties:
        status: {type: string, enum: [operational, error]}
        message: {type: string}
        details:
          type: object
          properties:
            databaseName: {type: string}
            databaseVersion: {type: string}
          additionalProperties: false
      additionalProperties: false
    LdapSystemServiceStatus:
      type: object
      required: [status, message, details]
      properties:
        status: {type: string, enum: [operational, error]}
        message: {type: string}
        details:
          type: object
          required: [endpoint, domain, baseDn, transportSecurity]
          properties:
            endpoint: {type: string}
            domain: {type: string}
            baseDn: {type: string}
            transportSecurity: {type: string}
          additionalProperties: false
      additionalProperties: false
    SmtpSystemServiceStatus:
      type: object
      required: [status, message, details]
      properties:
        status: {type: string, enum: [operational, error]}
        message: {type: string}
        details:
          type: object
          required: [endpoint, transportSecurity, sender]
          properties:
            endpoint: {type: string}
            transportSecurity: {type: string}
            sender: {type: string}
          additionalProperties: false
      additionalProperties: false
    StorageSystemServiceStatus:
      type: object
      required: [status, message, details]
      properties:
        status: {type: string, enum: [operational, error]}
        message: {type: string}
        details:
          type: object
          required: [path]
          properties:
            path: {type: string}
            freeSpace: {type: string}
          additionalProperties: false
      additionalProperties: false
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    CurrentUserResponse:
      type: object
      required: [csrfToken, user]
      properties:
        csrfToken:
          type: string
          minLength: 1
        user:
          $ref: '#/components/schemas/UserProfile'
      additionalProperties: false
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
      additionalProperties: false
    AuthenticationError:
      type: object
      required: [errors, ruleId]
      properties:
        errors:
          type: object
          required: [login]
          properties:
            login:
              type: array
              minItems: 1
              items:
                type: string
          additionalProperties: false
        ruleId:
          type: string
      additionalProperties: false
    DirectoryUnavailableError:
      type: object
      required: [name, message, code, status]
      properties:
        name:
          type: string
          enum: [Service Unavailable]
        message:
          type: string
          enum: [Сервер авторизации недоступен. Обратитесь в техническую поддержку.]
        code:
          type: integer
        status:
          type: integer
          enum: [503]
      additionalProperties: true
    UserProfile:
      type: object
      nullable: true
      required: [id, displayName, email, department, position, roles, features]
      properties:
        id:
          type: integer
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        features:
          type: object
          required: [lizaAi]
          properties:
            lizaAi: {type: boolean}
          additionalProperties: false
      additionalProperties: false
    AdminUsersResponse:
      type: object
      required: [items, checkedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        checkedAt:
          type: string
          format: date-time
      additionalProperties: false
    AdminUser:
      type: object
      required: [id, adLogin, displayName, email, department, position, isActive, lastLoginAt, lastActivityAt, roles]
      properties:
        id: {type: integer, minimum: 1}
        adLogin: {type: string}
        displayName: {type: string}
        email: {type: string, nullable: true}
        department: {type: string, nullable: true}
        position: {type: string, nullable: true}
        isActive: {type: boolean}
        lastLoginAt: {type: string, format: date-time, nullable: true}
        lastActivityAt: {type: string, format: date-time, nullable: true}
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'
      additionalProperties: false
    AdminRole:
      type: object
      required: [id, code, name]
      properties:
        id: {type: integer, minimum: 1}
        code: {type: string}
        name: {type: string}
      additionalProperties: false
    RequestStatus:
      type: string
      enum:
        - registered
        - in_progress
        - suspended
        - opinion_preparation
        - security_review
        - completed
        - rejected
        - withdrawn
    RequestPage:
      type: object
      required: [items, total, page, pageSize, pageCount, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        pageCount:
          type: integer
          minimum: 1
        counts:
          $ref: '#/components/schemas/RequestCounts'
      additionalProperties: false
    AttentionQueueId:
      type: string
      enum:
        - assign_executor
        - start_or_resume_work
        - upload_report
        - claim_expert
        - publish_opinion
        - security_decision
    AttentionDashboard:
      type: object
      required: [categories, operational_summary]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AttentionCategory'
        operational_summary:
          $ref: '#/components/schemas/OperationalSummary'
      additionalProperties: false
    OperationalSummary:
      type: object
      required: [active, unassigned, ready_to_start, in_progress, suspended, expertise, security_review, directions]
      properties:
        active:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        ready_to_start:
          type: integer
          minimum: 0
        in_progress:
          type: integer
          minimum: 0
        suspended:
          type: integer
          minimum: 0
        expertise:
          type: integer
          minimum: 0
        security_review:
          type: integer
          minimum: 0
        directions:
          type: array
          items:
            $ref: '#/components/schemas/OperationalDirection'
      additionalProperties: false
    OperationalDirection:
      type: object
      required: [id, title, color, active, unassigned, executors]
      properties:
        id:
          type: string
          enum: [mechanical, metrology, electrical, unclassified]
        title:
          type: string
        color:
          type: string
          enum: [blue, goldenrod, violet, neutral]
        active:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        executors:
          type: array
          description: Populated only for IC and laboratory managers; empty for other authenticated roles.
          items:
            $ref: '#/components/schemas/OperationalExecutorWorkload'
      additionalProperties: false
    OperationalExecutorWorkload:
      type: object
      required: [user_id, display_name, is_available, active, in_progress, suspended]
      properties:
        user_id:
          type: integer
          nullable: true
        display_name:
          type: string
        is_available:
          type: boolean
        active:
          type: integer
          minimum: 0
        in_progress:
          type: integer
          minimum: 0
        suspended:
          type: integer
          minimum: 0
      additionalProperties: false
    RequestEvents:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RequestEvent'
      additionalProperties: false
    RequestEvent:
      type: object
      required: [id, requestId, requestNumber, productName, type, title, authorName, occurredAt]
      properties:
        id:
          type: string
        requestId:
          type: integer
        requestNumber:
          type: string
          pattern: '^\d{6}$'
        productName:
          type: string
        type:
          type: string
          enum: [comment, event]
        title:
          type: string
        authorName:
          type: string
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
    AttentionCategory:
      type: object
      required: [id, title, description, count]
      properties:
        id:
          $ref: '#/components/schemas/AttentionQueueId'
        title:
          type: string
        description:
          type: string
        count:
          type: integer
          minimum: 0
      additionalProperties: false
    RequestCounts:
      type: object
      required: [active, all, mine]
      properties:
        active:
          type: integer
          minimum: 0
        all:
          type: integer
          minimum: 0
        mine:
          type: integer
          minimum: 0
      additionalProperties: false
    RequestSummary:
      description: |
        Первая формализованная часть строки реестра. Дополнительные исторические
        поля ответа пока не зафиксированы схемой и будут покрываться постепенно.
      type: object
      required: [id, number, status, source, is_archived, product_name, sample_quantity, legacy_sample_quantity_raw, lockVersion, department]
      properties:
        id:
          type: integer
        number:
          type: integer
        status:
          $ref: '#/components/schemas/RequestStatus'
        source:
          type: string
          enum: [local, bitrix24]
        is_archived:
          type: integer
          enum: [0, 1]
        sample_quantity:
          type: integer
          minimum: 1
          nullable: true
          description: Точное количество образцов; null допустим только для архивной импортированной заявки
        legacy_sample_quantity_raw:
          type: string
          nullable: true
          description: Исходное значение количества из Битрикс24 без смысловой нормализации
        product_name:
          type: string
        lockVersion:
          type: integer
          minimum: 1
        department:
          type: string
      additionalProperties: true
    AddCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
      additionalProperties: false
    TestActPreparation:
      type: object
      required: [documentType, actNumber, actDate, sampleName, basis, testMethod, requestNumber, approverName, contactEmail]
      properties:
        documentType: {type: string, enum: [test_act]}
        actNumber: {type: string, maxLength: 100}
        actDate: {type: string, pattern: '^\d{2}\.\d{2}\.\d{4}$'}
        sampleName: {type: string}
        basis: {type: string, maxLength: 1000}
        testMethod: {type: string}
        requestNumber: {type: integer, minimum: 1}
        approverName: {type: string, minLength: 1}
        contactEmail: {type: string, format: email}
      additionalProperties: false
    TestActInput:
      type: object
      required: [actNumber, actDate, basis, result]
      properties:
        actNumber: {type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*'}
        actDate: {type: string, pattern: '^\d{2}\.\d{2}\.\d{4}$'}
        basis: {type: string, minLength: 1, maxLength: 1000, pattern: '.*\S.*'}
        result: {type: string, minLength: 1, maxLength: 20000, pattern: '.*\S.*'}
      additionalProperties: false
    RequiredReason:
      type: string
      minLength: 1
      maxLength: 5000
      pattern: '.*\S.*'
      description: Непустая после обрезки пробелов причина действия
    ReasonedLockVersionInput:
      type: object
      required: [lockVersion, reason]
      properties:
        lockVersion: {type: integer, minimum: 1}
        reason: {$ref: '#/components/schemas/RequiredReason'}
      additionalProperties: false
    SecurityDecisionInput:
      oneOf:
        - type: object
          required: [decision, lockVersion]
          properties:
            decision: {type: string, enum: [approve]}
            lockVersion: {type: integer, minimum: 1}
            reason:
              type: string
              maxLength: 5000
              pattern: '^\s*$'
              nullable: true
              description: Для согласования допускается только пустое после обрезки пробелов значение
          additionalProperties: false
        - type: object
          required: [decision, lockVersion, reason]
          properties:
            decision: {type: string, enum: [return]}
            lockVersion: {type: integer, minimum: 1}
            reason: {$ref: '#/components/schemas/RequiredReason'}
          additionalProperties: false
    RevokeRoleInput:
      type: object
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/RequiredReason'}
      additionalProperties: false
    RequestCommandResult:
      type: object
      required: [status, lockVersion]
      properties:
        requestId: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/RequestStatus'}
        lockVersion: {type: integer, minimum: 1}
      additionalProperties: true
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id: {type: integer, minimum: 1}
              code: {type: string}
              name: {type: string}
            additionalProperties: false
      additionalProperties: false
    Comment:
      type: object
      required: [id, body, createdAt, authorName]
      properties:
        id:
          type: integer
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        authorName:
          type: string
      additionalProperties: false
    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    HttpError:
      type: object
      required: [name, message, code, status, type]
      properties:
        name:
          type: string
        message:
          type: string
        code:
          type: integer
        status:
          type: integer
        type:
          type: string
      additionalProperties: true
