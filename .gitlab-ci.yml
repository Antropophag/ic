stages:
  - test
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

frontend:
  stage: test
  image: node:22.23.0-alpine3.23
  script:
    - npm --prefix frontend ci --no-audit --no-fund
    - npm --prefix frontend run lint
    - npm --prefix frontend run audit
    - npm --prefix frontend run build
    - npm --prefix frontend run coverage

backend-unit:
  stage: test
  image: composer:2.8.10
  script:
    - cd backend
    - composer install --no-interaction --no-progress
    - composer lint
    - composer analyse
    - composer audit
    - composer test

backend-coverage:
  stage: test
  image: docker:29.0.0-cli
  services:
    - name: docker:29.0.0-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache python3
  script:
    - mkdir -p backend/build/coverage
    - docker build --file docker/coverage.Dockerfile --tag shlz-test-registry-coverage .
    - docker run --rm --volume "$CI_PROJECT_DIR/backend/build/coverage:/app/build/coverage" shlz-test-registry-coverage
    - python3 scripts/check_coverage.py backend/build/coverage/clover.xml --minimum 90

api-smoke:
  stage: test
  image: docker:29.0.0-cli
  services:
    - name: docker:29.0.0-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BASE_URL: http://docker:8080
  before_script:
    - apk add --no-cache curl
    - cp .env.example .env
  script:
    - docker compose up -d --build
    - docker compose run --rm backend ./yii migrate/up
    - docker compose run --rm backend ./yii dev/seed
    - sh scripts/smoke.sh
  after_script:
    - docker compose down --volumes

documentation:
  stage: test
  image: python:3.13.5-alpine3.22
  script:
    - python3 -m py_compile scripts/gen_schema_diagram.py
    - git diff --check

repository-quality:
  stage: test
  image: node:22.23.0-bookworm
  variables:
    ACTIONLINT_VERSION: "1.7.7"
    HADOLINT_VERSION: "2.12.0"
    HADOLINT_SHA256: "56de6d5e5ec427e17b74fa8d51271c7fc0d61244bf5c90e828aab8362d55010"
    SHFMT_VERSION: "3.10.0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl python3-pip shellcheck
    - pip3 install --break-system-packages "yamllint==1.37.1"
    - npm --prefix frontend ci --no-audit --no-fund
    - shfmt_bin="shfmt_v${SHFMT_VERSION}_linux_amd64"
    - curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${shfmt_bin}" -o "${shfmt_bin}"
    - curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/sha256sums.txt" -o shfmt_sha256sums.txt
    - grep " ${shfmt_bin}$" shfmt_sha256sums.txt | sha256sum -c -
    - install -m 0755 "${shfmt_bin}" /usr/local/bin/shfmt
    - curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
    - echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
    - install -m 0755 hadolint /usr/local/bin/hadolint
    - actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
    - curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}" -o "${actionlint_archive}"
    - curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o actionlint_checksums.txt
    - grep " ${actionlint_archive}$" actionlint_checksums.txt | sha256sum -c -
    - tar -xzf "${actionlint_archive}" actionlint
    - install -m 0755 actionlint /usr/local/bin/actionlint
  script:
    - make repo-quality

demo-bundle:
  stage: package
  image: docker:29.0.0-cli
  services:
    - name: docker:29.0.0-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh scripts/build-demo-bundle.sh dist-demo
  artifacts:
    name: "shlz-demo-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist-demo/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_COMMIT_TAG'

# После появления integration-контура этот job поднимет MariaDB, применит
# миграции и включит `make schema-diagram-check` как обязательный quality gate.
