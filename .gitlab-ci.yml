stages: [test]

default:
  tags: [runner-test]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.docker-bookworm:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl make python3-pip sudo
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - . /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update
    - apt-get install -y --no-install-recommends docker-ce-cli docker-compose-plugin

check:
  extends: .docker-bookworm
  stage: test
  image: node:22.23.0-bookworm
  services:
    - name: docker:29.0.0-dind
      command: ["dockerd", "--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh scripts/install-ci-linters.sh
    - make check

coverage:
  extends: .docker-bookworm
  stage: test
  image: node:22.23.0-bookworm
  services:
    - name: docker:29.0.0-dind
      command: ["dockerd", "--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script: [make coverage]

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  services:
    - name: docker:29.0.0-dind
      command: ["dockerd", "--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_PUBLISHED_HOST: docker
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends docker.io docker-compose-v2 make
  script: [make e2e]
  after_script:
    - make _test-down
  artifacts:
    when: on_failure
    paths: [frontend/playwright-report/]

analyze:
  stage: test
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error backend/src frontend/src

secrets:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --no-banner
