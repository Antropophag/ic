services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    env_file: ${COMPOSE_ENV_FILE:?COMPOSE_ENV_FILE must select .env.dev or .env.prod}
    environment:
      APP_VERSION: ${APP_VERSION:-}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-}
    depends_on:
      mariadb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/runtime
    volumes:
      - document-data:/app/storage/documents
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    env_file: ${COMPOSE_ENV_FILE:?COMPOSE_ENV_FILE must select .env.dev or .env.prod}
    environment:
      APP_VERSION: ${APP_VERSION:-}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-}
    depends_on:
      mariadb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/runtime
    command: ["php", "yii", "notification/work"]
    stop_signal: SIGTERM
    stop_grace_period: 15s
    restart: unless-stopped

  ai-cleanup:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    env_file: ${COMPOSE_ENV_FILE:?COMPOSE_ENV_FILE must select .env.dev or .env.prod}
    depends_on:
      mariadb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/runtime
    command: ["php", "yii", "ai/work"]
    stop_signal: SIGTERM
    stop_grace_period: 15s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4.7-noble
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mariadb-data:
  document-data:
